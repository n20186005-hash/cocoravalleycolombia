name: Screenshot Cocora desktop and mobile
on:
  push:
    branches: ['verify/132-public-guides-20261124']
    paths:
      - 'scripts/visual-cocora.cjs'
      - '.github/workflows/screenshot-cocora.yml'
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use the runner’s preinstalled Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/cocora-ui" --no-audit --no-fund playwright@1.56.0
          google-chrome --version
      - name: Compare the homepage with the live place page and follow both nearby links
        run: NODE_PATH="$RUNNER_TEMP/cocora-ui/node_modules" node scripts/visual-cocora.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocora-arrieros-desktop-mobile
          path: screenshots/
          if-no-files-found: ignore
